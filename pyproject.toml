[project]
name = "swing-coach"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.108",
    "confluent-kafka>=2.16.0",
    "dbt-core>=1.12.5",
    "dbt-trino>=1.10.6",
    "fastapi>=0.142.2",
    "langgraph>=1.2.14",
    "mediapipe>=1.1.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "trino>=0.340.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
# Explicit paths: the editable-install .pth is ignored when the project path has Korean characters.
pythonpath = ["src", "pipeline"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
