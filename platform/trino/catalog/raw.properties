# Landing zone: parquet extracts dropped into s3://raw/ are exposed as external Hive tables.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://raw/_metastore
hive.non-managed-table-writes-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
